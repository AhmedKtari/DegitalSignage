<header>
    <nav class="navbar navbar-expand-md navbar-dark bg-dark sticky-top">
        <div class="container">
            <a class="navbar-brand" routerLink="/">{{appName}}</a>
            <button class="navbar-toggler" type="button" (click)="toggleMenu()">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" [class.show]="isMenuOpen" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" routerLink="/welcome">Welcome</a>
                    </li>
                </ul>
                    @if (!LogginStatuts) {
                     <ul class="navbar-nav navbar-collapse justify-content-end">
                         <li class="nav-item">
                            <a class="nav-link" routerLink="/login">Login</a>
                         </li>
                    </ul>
                    }
                    @else {
                        <!-- User is logged in, swapped with empty div -->
                        <div></div>
                    }
                    @if (LogginStatuts){
                    <ul class="navbar-nav">
                        <li class="nav-item">
                            <button class="nav-link" (click)="navigateToProfile()">Profile</button>
                        </li>
                    </ul>
                    <ul class="navbar-nav navbar-collapse justify-content-end">
                        <li class="nav-item">
                            <a class="nav-link" routerLink="/logout">Logout</a>
                        </li>
                    </ul>
                    }
                     @else {
                        <!-- User isnt  logged in, swapped with empty div -->
                        <div></div>
                    }
                
            </div>
        </div>
    </nav>
</header>
